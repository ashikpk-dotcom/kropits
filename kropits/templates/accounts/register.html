{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">{% trans "Register" %}</h4>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="phone_number" class="form-label">{% trans "Phone Number" %}</label>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="first_name" class="form-label">{% trans "First Name" %}</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">{% trans "Last Name" %}</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">{% trans "Email" %}</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">{% trans "Role" %}</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="farmer">{% trans "Farmer" %}</option>
                            <option value="buyer">{% trans "Buyer" %}</option>
                            <option value="delivery">{% trans "Delivery Partner" %}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="language_preference" class="form-label">{% trans "Language Preference" %}</label>
                        <select class="form-select" id="language_preference" name="language_preference">
                            <option value="en">English</option>
                            <option value="ml">മലയാളം</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{% trans "Password" %}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">{% trans "Confirm Password" %}</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">{% trans "Register" %}</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="/api/auth/login-page/">{% trans "Already have an account? Login" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
        alert('{% trans "Passwords do not match" %}');
        return;
    }

    const data = {
        phone_number: document.getElementById('phone_number').value,
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        email: document.getElementById('email').value,
        role: document.getElementById('role').value,
        language_preference: document.getElementById('language_preference').value,
        password: password,
        password2: password2
    };

    try {
        const response = await fetch('/api/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            const result = await response.json();
            localStorage.setItem('access_token', result.access);
            localStorage.setItem('refresh_token', result.refresh);
            window.location.href = '/';
        } else {
            const error = await response.json();
            alert('Registration failed: ' + JSON.stringify(error));
        }
    } catch (error) {
        alert('An error occurred. Please try again.');
    }
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
